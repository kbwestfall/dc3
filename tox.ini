[tox]
envlist =
    {3.12,3.13,3.14}-test{,-alldeps}{,-cov}
    {3.12,3.13,3.14}-test-{numpy,astropy,ppxf}dev
    3.12-test-ppxfmin
    codestyle
requires =
    setuptools >= 65.0
    pip >= 22.0
isolated_build = true

[testenv]
# Suppress display of matplotlib plots generated during the tests
setenv =
    MPLBACKEND=agg
    numpydev: PIP_EXTRA_INDEX_URL = https://pypi.anaconda.org/scipy-wheels-nightly/simple
    astropydev: PIP_EXTRA_INDEX_URL = https://pypi.anaconda.org/astropy/simple

passenv = HOME,WINDIR,LC_ALL,LC_CTYPE,CC,CI

# Run the tests in a temporary directory to make sure that we don't import
# this package from the source tree
changedir = .tmp/{envname}

description =
    run tests
    alldeps: with all optional dependencies
    numpydev: with the latest developer version of numpy
    astropydev: with the latest developer version of astropy
    ppxfdev: with the latest release of ppxf
    ppxfmin: with the minimum supported version of ppxf
    cov: and test coverage

# NOTE: ppxf sits on the critical path via ppxf_util.varsmooth and
# ppxf_util.losvd_rfft, so both the floor and the latest release are pinned as
# explicit axes.  See the port plan, verification item 14.
deps =
    cov: coverage

    numpydev: numpy>=0.0.dev0
    astropydev: astropy>=0.0.dev0
    ppxfdev: ppxf
    ppxfmin: ppxf==9.5.0

extras =
    test
    alldeps: fftw
    alldeps: jax
    alldeps: mcmc

commands =
    pip freeze
    !cov: pytest --pyargs dc3 {posargs}
    cov: pytest --pyargs dc3 --cov dc3 --cov-config={toxinidir}/pyproject.toml {posargs}
    cov: coverage xml -o {toxinidir}/coverage.xml

[testenv:codestyle]
skip_install = true
changedir = .
description = check code style, e.g. with pycodestyle
deps = pycodestyle
commands = pycodestyle dc3 --count --select=E9
